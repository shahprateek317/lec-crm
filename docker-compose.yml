# LEC CRM — production docker compose stack.
#
# Layout:
#   db     → Postgres 17, internal-only, persistent volume
#   app    → Next.js standalone (this repo), runs Prisma migrations on boot
#   caddy  → Caddy 2, auto-HTTPS reverse proxy, exposes :80 / :443
#
# Bring up:
#   docker compose up -d --build
# Tail logs:
#   docker compose logs -f app
# Stop:
#   docker compose down
# Backup DB (one-shot):
#   docker compose exec db pg_dump -U lec -d lec_crm | gzip > backup.sql.gz

name: lec-crm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lec_crm}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lec} -d ${POSTGRES_DB:-lec_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lec-crm:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Construct DATABASE_URL inside the container so the host doesn't need to know it.
      DATABASE_URL: postgresql://${POSTGRES_USER:-lec}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lec_crm}?schema=public
      TZ: Asia/Kolkata
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
